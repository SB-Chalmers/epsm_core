   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #455463" x="49.104" y="316.8" transform="rotate(-0 49.104 316.8)">Zones follow original storeys. If a facade is exposed during part of a storey, its perimeter region spans that whole storey.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #455463" x="49.104" y="332.28" transform="rotate(-0 49.104 332.28)">Actual wall surfaces retain the neighbour's exact height. These plans use the illustrative 4.5 m depth and compact flat roofs.</text>
  </g>

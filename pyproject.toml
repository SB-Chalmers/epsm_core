[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_core"
version = "2.0.0"
description = "Explicit building specifications and EnergyPlus epJSON simulation for UBEM"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "shapely>=2.1,<3", "numpy>=2,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
pv = ["nrel-pysam>=7.1,<8"]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
epsm-core = "epsm_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_core*"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
markers = ["energyplus: runs the EnergyPlus 24.2 binary"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/core/*" = ["F403", "F405"]

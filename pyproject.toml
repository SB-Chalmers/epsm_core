[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_core"
dynamic = ["version"]
description = "Explicit building specifications and EnergyPlus epJSON simulation for UBEM"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["epsm_data>=0.7.0", "pydantic>=2.10,<3", "shapely>=2.1,<3", "numpy>=2,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
geometry = ["py-straight-skeleton==0.1.0"]
pv = ["nrel-pysam>=7.1,<8"]
dev = ["pytest>=8", "ruff>=0.11"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "matplotlib>=3.9,<4", "pandas>=2.2,<4", "nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8"]

[project.scripts]
epsm-core = "epsm_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_core*"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
pythonpath = ["src"]
markers = ["energyplus: runs the EnergyPlus 24.2 binary"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/core/*" = ["F403", "F405"]

[tool.setuptools.dynamic]
version = {attr = "epsm_core._version.__version__"}

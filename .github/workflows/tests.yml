name: Core tests
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      development_dependencies:
        description: Test Data dev on Python 3.13 instead of the pinned release matrix
        type: boolean
        default: false

# A newer PR revision replaces its old checks. Release/manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Routine and release checks keep both supported Python versions pinned.
        # Development-dependency compatibility is one explicitly requested lane.
        python: ${{ fromJSON(inputs.development_dependencies && '["3.13"]' || '["3.11", "3.13"]') }}
        dependencies: ${{ fromJSON(inputs.development_dependencies && '["dev"]' || '["pinned"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Check private prerelease dependency access
        env:
          EPSM_DATA_DEPLOY_KEY: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
        run: |
          if [ -z "$EPSM_DATA_DEPLOY_KEY" ]; then
            echo "::error::Set EPSM_DATA_DEPLOY_KEY to a read-only deploy key for SB-Chalmers/epsm_data. The private dependency requires read access; tests have not run."
            exit 1
          fi
      # The tested Data release remains fixed; dev is available by manual request.
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.dependencies == 'dev' && 'dev' || 'bc8449402b9e0dbe0ea85ff76c954cf36d209f86' }}
          path: .ci/epsm_data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .ci/epsm_data/pyproject.toml
      - run: python -m pip install build .ci/epsm_data '.[dev,geometry]'
      - name: Reuse required EnergyPlus 24.2
        id: energyplus-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/energyplus
          key: energyplus-${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-24.2.0-e7ecb2d53b
      - name: Install required EnergyPlus 24.2
        if: steps.energyplus-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v24.2.0 --repo NatLabRockies/EnergyPlus --pattern 'EnergyPlus-24.2.0-e7ecb2d53b-Linux-Ubuntu22.04-x86_64.tar.gz' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/energyplus"
          tar -xzf "$RUNNER_TEMP/EnergyPlus-24.2.0-e7ecb2d53b-Linux-Ubuntu22.04-x86_64.tar.gz" -C "$RUNNER_TEMP/energyplus" --strip-components=1
      - name: Select required EnergyPlus 24.2
        run: |
          test -x "$RUNNER_TEMP/energyplus/energyplus"
          echo "ENERGYPLUS_EXE=$RUNNER_TEMP/energyplus/energyplus" >> "$GITHUB_ENV"
      - name: Record tested revisions
        run: |
          git rev-parse HEAD
          git -C .ci/epsm_data rev-parse HEAD
          "$ENERGYPLUS_EXE" --version
      - run: ruff check src/epsm_core examples
      - name: Build and install release distributions
        run: |
          python -m build
          python -m pip install --no-deps --force-reinstall dist/epsm_core-*.whl
      - name: Run full installed Core suite with real engine
        env:
          EPSM_REQUIRE_ENERGYPLUS: '1'
        run: pytest -o pythonpath= --junitxml=core-results.xml
      - name: Check installed scene handoff without display dependencies
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PYTHON'
          import importlib.util
          import json
          import sys
          from epsm_core import Building, Footprint
          building = Building.from_footprint(Footprint.rectangle(4, 3), storeys=1, storey_height_m=3)
          assert json.loads(json.dumps(building.scene()))['schema'] == 'epsm.scene/1'
          assert importlib.util.find_spec('epsm_core.viewer') is None
          assert importlib.util.find_spec('epsm_core.notebook') is None
          assert not any(name in sys.modules for name in ('epsm_viewer', 'anywidget', 'ipywidgets'))
          PYTHON
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.python }}-${{ matrix.dependencies }}
          path: |
            core-results.xml
            dist/
